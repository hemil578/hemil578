<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reel</title>
<style>
:root{--accent:#ffd400;--ink:#111;--paper:#fff;--cap:#fff;--font:'Arial Black','Helvetica Neue',Arial,sans-serif;--body:'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#000}
body{font-family:var(--body);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#reel{position:relative;overflow:hidden;background:#000}
.scene,.layer{position:absolute;inset:0;pointer-events:none}
.scene{display:none}
.bg{position:absolute;left:0;top:0;transform-origin:0 0;object-fit:cover}
.char{position:absolute;left:0;top:0;transform-origin:50% 100%}
.char .pose{position:absolute;left:0;bottom:0;width:100%;height:100%;transform-origin:50% 50%}
.char .pose>img{position:absolute;left:0;bottom:0;width:100%;height:auto}
.char .over{position:absolute}
.char .ovclip{position:absolute;left:0;top:0;overflow:hidden}
.char .ovclip img{display:block}
.char .ovlip{position:absolute;left:6%;right:6%;top:0;display:none;pointer-events:none}
.txt{position:absolute;left:0;top:0;width:100%;text-align:center;font-family:var(--font);line-height:1.02;letter-spacing:-.01em;
  -webkit-text-stroke:0;paint-order:stroke fill;white-space:pre-line}
.txt .w{display:inline-block}
.card{position:absolute;left:0;top:0;display:flex;align-items:center;gap:28px;background:#fff;color:#111;border-radius:44px;
  padding:30px 38px;box-shadow:0 30px 70px -20px rgba(0,0,0,.45),0 8px 20px -8px rgba(0,0,0,.25);font-family:var(--body)}
.card .ic{flex:none;width:112px;height:112px;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:64px;background:#2ec463;color:#fff}
.card .ic img{width:100%;height:100%;object-fit:cover;border-radius:30px}
.card .t{font-weight:800;font-size:48px;line-height:1.1}
.card .b{font-size:40px;color:#555;margin-top:6px;line-height:1.18}
.card .app{font-size:28px;color:#999;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.card.chat{border-radius:48px 48px 48px 12px;background:#fff}
.card.chat.me{background:#1f8cff;color:#fff;border-radius:48px 48px 12px 48px}
.card.chat.me .b{color:#e8f2ff}
.card.button{background:var(--accent);color:#111;justify-content:center;border-radius:999px;padding:34px 70px}
.card.button .t{font-family:var(--font);font-size:58px}
.card.stat{flex-direction:column;align-items:flex-start;gap:4px}
.card.stat .t{font-family:var(--font);font-size:110px;line-height:1}
.pic{position:absolute;left:0;top:0;transform-origin:50% 50%}
.pic img{display:block;width:100%;height:auto}
.pic.phone{background:#0d0d0d;border-radius:72px;padding:22px;box-shadow:0 40px 90px -30px rgba(0,0,0,.6)}
.pic.phone img{border-radius:52px}
.pic.shadow img{box-shadow:0 40px 90px -30px rgba(0,0,0,.55);border-radius:24px}
#caps{position:absolute;left:0;top:0;width:100%;text-align:center;font-family:var(--font);color:var(--cap)}
#caps .w{display:inline-block;margin:0 .14em}
#flash{position:absolute;inset:0;background:#fff;opacity:0;visibility:hidden}
#black{position:absolute;inset:0;background:#000;opacity:0;visibility:hidden}
#safe{position:absolute;inset:0;visibility:hidden}
#safe div{position:absolute;background:rgba(255,0,80,.28);outline:3px dashed #ff0050}
</style>
<style id="brand-css"></style>
</head>
<body>
<div id="reel"></div>
<script src="engine.js"></script>
</body>
</html>
