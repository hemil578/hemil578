    #bg-w1 { top: 1180px; }
    #bg-w2 { top: 300px; }
    #bg-w3 { top: 240px; }
    #bg-w4 { top: 1380px; }
    .bg-shape { position: absolute; left: 0; top: 0; }
    .bg-ring { width: 120px; height: 120px; border-radius: 60px; border: 14px solid #ffffff; }
    .bg-dot { width: 54px; height: 54px; border-radius: 27px; background: #ffd23f; }

  </style>
  <div id="root" data-composition-id="bgfx" data-width="1080" data-height="1920">
    <div id="bg-rays"></div>
    <!-- oversized outline words drifting behind each teal world (typography as texture) -->
    <div id="bg-w1" class="bg-word clip" data-start="0" data-duration="2.9" data-layout-allow-overflow data-layout-ignore>TRENDING TRENDING</div>
    <div id="bg-w2" class="bg-word clip" data-start="7.85" data-duration="1.25" data-layout-allow-overflow data-layout-ignore>PACKED PACKED</div>
    <div id="bg-w3" class="bg-word clip" data-start="14.44" data-duration="5.41" data-layout-allow-overflow data-layout-ignore>UNBOX UNBOX UNBOX</div>
    <div id="bg-w4" class="bg-word clip" data-start="19.85" data-duration="4.78" data-layout-allow-overflow data-layout-ignore>BUYR BUYR BUYR</div>
    <!-- brand shapes around the edges; they pop and spin on the beat -->
    <div id="bg-s0" class="bg-shape bg-ring" data-layout-ignore></div>
    <svg id="bg-s1" class="bg-shape bg-plus" viewBox="0 0 10 10" data-layout-ignore><path d="M4 0h2v4h4v2H6v4H4V6H0V4h4z" fill="#0f172a"/></svg>
    <div id="bg-s2" class="bg-shape bg-dot" data-layout-ignore></div>
    <svg id="bg-s3" class="bg-shape bg-squig" viewBox="0 0 100 30" data-layout-ignore><path d="M4 15 Q16 2 28 15 T52 15 T76 15 T100 15" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/></svg>
    <svg id="bg-s4" class="bg-shape bg-star" viewBox="0 0 24 24" data-layout-ignore><path d="M12 1l3 7.6 8 .6-6.1 5.2 1.9 7.8L12 18l-6.8 4.2 1.9-7.8L1 9.2l8-.6z" fill="#ffd23f" stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round"/></svg>
    <div id="bg-s5" class="bg-shape bg-ring" style="border-color:#0f172a" data-layout-ignore></div>
    <svg id="bg-s6" class="bg-shape bg-plus" viewBox="0 0 10 10" data-layout-ignore><path d="M4 0h2v4h4v2H6v4H4V6H0V4h4z" fill="#ffffff"/></svg>
    <div id="bg-s7" class="bg-shape bg-dot" style="background:#ffffff" data-layout-ignore></div>
    <svg id="bg-s8" class="bg-shape bg-squig" viewBox="0 0 100 30" data-layout-ignore><path d="M4 15 Q16 2 28 15 T52 15 T76 15 T100 15" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/></svg>
    <svg id="bg-s9" class="bg-shape bg-star" viewBox="0 0 24 24" data-layout-ignore><path d="M12 1l3 7.6 8 .6-6.1 5.2 1.9 7.8L12 18l-6.8 4.2 1.9-7.8L1 9.2l8-.6z" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const D = 24.63, BEAT = 0.6, B0 = 0.05;
    // edge positions (kept out of the centre column where the story happens)
    const POS = [[70,420],[930,250],[110,1300],[860,1520],[50,560],[990,1250],[150,1640],[960,640],[60,180],[880,1760]];
    const st = { t: 0 };
    const render = () => {
      const t = st.t;
      const b = ((t - B0) / BEAT) % 1, beatAmt = t < B0 ? 0 : Math.exp(-b * 7);  // spikes on every beat
      gsap.set("#bg-rays", { rotation: t * 9, scale: 1 + beatAmt * 0.05 });
      POS.forEach(([x, y], i) => {
        const ph = i * 0.9;
        const dx = Math.sin(t * 0.8 + ph) * 26, dy = Math.cos(t * 0.65 + ph) * 34;
        const pop = 1 + beatAmt * (i % 2 ? 0.28 : 0.18);
        const spin = (i % 3 === 0 ? 1 : -1) * (t * 40 + Math.floor((t - B0) / BEAT) * (i % 2 ? 45 : 0));
        gsap.set("#bg-s" + i, { x: x + dx - 50, y: y + dy - 50, scale: pop, rotation: spin });
      });
      // words drift slowly sideways (each one alternates direction)
      gsap.set("#bg-w1", { x: -200 - t * 120 });
      gsap.set("#bg-w2", { x: -900 + (t - 7.85) * 160 });
      gsap.set("#bg-w3", { x: -300 - (t - 14.44) * 110 });
      gsap.set("#bg-w4", { x: -700 + (t - 19.85) * 90 });
    };
    tl.to(st, { t: D, duration: D, ease: "none", onUpdate: render }, 0);
    // shapes enter on the first hit with a stagger
    tl.fromTo(".bg-shape", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.05, ease: "power2.out" }, 0.05);
    tl.call(render, null, 0);
    render();
    window.__timelines["bgfx"] = tl;
  </script>
