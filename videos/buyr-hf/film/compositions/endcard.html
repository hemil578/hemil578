<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: transparent; font-family: "Poppins", sans-serif; }
    #ec-floor { position: absolute; left: 0; right: 0; top: 1360px; bottom: 0; background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.22)); }
    #ec-flash { position: absolute; inset: 0; background: #ffffff; }
    #ec-ring { position: absolute; left: 240px; top: 600px; width: 600px; height: 600px; border-radius: 300px; border: 16px solid #ffffff; }

  </style>
  <div id="root" data-composition-id="endcard" data-width="1080" data-height="1920">
    <div id="ec-floor"></div>
    <div id="ec-ring"></div>
    <div id="ec-card"><img src="assets/logo.png" alt="Buyr" /></div>
    <div id="ec-l1" class="ec-line clip" data-start="0.35" data-duration="4.43"><span id="ec-l1-in">Trending Finds.</span></div>
    <div id="ec-l2" class="ec-line clip" data-start="0.6" data-duration="4.18"><span id="ec-l2-in">Shipped Free</span></div>
    <div id="ec-l3" class="ec-line clip" data-start="0.8" data-duration="3.98"><span id="ec-l3-in">to Your Door.</span></div>
    <div id="ec-btn" class="clip" data-start="1.2" data-duration="3.58"><span id="ec-btn-in">buyrshop.com</span></div>
    <div id="ec-ship" class="clip" data-start="1.8" data-duration="2.98"><span id="ec-ship-in">Free US shipping on every order</span></div>
    <div id="ec-flash"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // split a headline into letters (bottom-up-letters pattern) so it can be staggered
    const letters = (sel) => { const el = document.querySelector(sel); const txt = el.innerHTML.split(/<br\s*\/?>/i);
      el.innerHTML = txt.map((line) => Array.from(line).map((c) => '<span class="kl" style="display:inline-block">' + (c === " " ? "&nbsp;" : c) + "</span>").join("")).join("<br />");
      return el.querySelectorAll(".kl"); };
    const slam = (sel, t0) => tl.fromTo(letters(sel), { y: 110, rotation: 12, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.32, ease: "back.out(2.4)", stagger: 0.022 }, t0);
    // 19.85: the collapse becomes the mark: flash, ring kick, the logo card is carried out of the centre
    tl.fromTo("#ec-flash", { opacity: 0.9 }, { opacity: 0, duration: 0.25, ease: "power2.out" }, 0);
    tl.fromTo("#ec-ring", { scale: 0.1, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.5, ease: "power2.out" }, 0);
    tl.fromTo("#ec-card", { x: 0, y: 600, scale: 0.1, rotation: -25 }, { y: 0, scale: 1, rotation: 0, duration: 0.42, ease: "back.out(1.5)" }, 0.02);
    // lines wipe in one after another (clip-path reveal, left to right)
    slam("#ec-l1-in", 0.35); slam("#ec-l2-in", 0.6); slam("#ec-l3-in", 0.8);
    // 21.05: the call to action lands, then pulses on every beat to the end
    tl.fromTo("#ec-btn-in", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(2)" }, 1.2);
    for (let k = 0; k < 6; k++) tl.to("#ec-btn-in", { scale: 1.05, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, 1.8 + k * 0.6);
    tl.fromTo("#ec-ship-in", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, 1.8);
    tl.set("#ec-ring", { opacity: 0 }, 0.6);
    window.__timelines["endcard"] = tl;
  </script>
