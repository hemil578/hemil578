  <script>
    const tl = gsap.timeline({ paused: true });
    const N = 16, HERO = 6;
    const RISE = [0.31, 0.9099999999999999, 1.51, 2.11, 2.71, 3.31];               // a hero starts rising 0.3 s before its beat and peaks on it
    const FOUNT = Array.from({ length: N - HERO }, (_, j) => 3.9 + j * 0.12);
    const COLLAPSE = 5.11, END = 5.41;
    const HIDE_Y = 1450, TOP_Y = 700;   // centre inside the box (behind the front face) and centre above the box
    // parking slots on an arc around the frame, clear of the box; heroes alternate sides
    const ANG = Array.from({ length: N }, (_, i) => (160 + i * (220 / (N - 1))) * Math.PI / 180);
    const order = [0, 15, 3, 12, 6, 9, 1, 14, 2, 13, 4, 11, 5, 10, 7, 8];
    const slot = (i) => { const a = ANG[order[i]]; return [540 + Math.cos(a) * 420, 760 + Math.sin(a) * 540]; };
    const els = Array.from({ length: N }, (_, i) => document.querySelector("#ub-p" + i));
    const PARK = 0.42; // parked size relative to 560 px
    const e3 = (x) => 1 - Math.pow(1 - x, 3), clamp = (x) => Math.max(0, Math.min(1, x));
    const st = { t: 0 };
    const render = () => {
      const t = st.t;
      els.forEach((el, i) => {
        let x = 540, y = HIDE_Y, s = 0.8, r = 0, z = 5, vis = 0;
        const [px, py] = slot(i);
        if (i < HERO) {
          const r0 = RISE[i], toss = (i + 1 < HERO ? RISE[i + 1] : 3.9) + 0.02;
          if (t >= r0) {
            vis = 1; z = 50;
            const up = e3(clamp((t - r0) / 0.28));
            y = HIDE_Y + (TOP_Y - HIDE_Y) * up; s = 0.8 + 0.2 * up;
            r = Math.sin((t - r0) * 9) * 4 * (1 - clamp((t - r0 - 0.3) / 0.3));
            if (t >= toss) {
              const k = e3(clamp((t - toss) / 0.32));
              x = 540 + (px - 540) * k; y = TOP_Y + (py - TOP_Y) * k - Math.sin(Math.PI * k) * 160;
              s = 1 + (PARK - 1) * k; r = (i % 2 ? 1 : -1) * 360 * k; z = 150 + i;
              if (k >= 1) r = (i % 2 ? 1 : -1) * 8;
            }
          }
        } else {
          const f0 = FOUNT[i - HERO];
          if (t >= f0 - 0.15) {
            vis = 1; z = 50;
            const up = clamp((t - (f0 - 0.15)) / 0.15);
            const k = e3(clamp((t - f0) / 0.42));
            y = HIDE_Y + (1000 - HIDE_Y) * up; s = 0.6;
            if (t >= f0) { x = 540 + (px - 540) * k; y = 1000 + (py - 1000) * k - Math.sin(Math.PI * k) * 420; s = 0.6 + (PARK - 0.6) * k; r = (i % 2 ? 1 : -1) * 540 * (1 - k) + (i % 2 ? 1 : -1) * 8; if (k > 0.25) z = 150 + i; }
          }
        }
        // a parked product bobs on the beat (deterministic from t)
        if (vis && z >= 150 && t < COLLAPSE) { const b = ((t - 0.0) / 0.6) % 1; y -= Math.exp(-b * 8) * 14; }
        if (t > COLLAPSE) { const c = Math.pow(clamp((t - COLLAPSE) / (END - COLLAPSE)), 3); x += (540 - x) * c; y += (900 - y) * c; s *= 1 - 0.9 * c; r += 200 * c; }
        gsap.set(el, { x: x - 280, y: y - 280, scale: s, rotation: r, opacity: vis, zIndex: z });
      });
    };
    tl.to(st, { t: END, duration: END, ease: "none", onUpdate: render }, 0);
    // 14.44 drop: flash, the box jolts, flaps burst open
    tl.fromTo("#ub-flash", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, 0);
    tl.fromTo("#ub-cam", { scale: 1.12, y: -40 }, { scale: 1, y: 0, duration: 0.5, ease: "expo.out", transformOrigin: "540px 1300px" }, 0);
    tl.fromTo("#ub-flap-l", { rotation: 0, scaleY: 0.12, skewX: 0 }, { rotation: -38, scaleY: 1, skewX: 8, duration: 0.42, ease: "back.out(2.4)", transformOrigin: "0% 100%" }, 0.02);
    tl.fromTo("#ub-flap-r", { rotation: 0, scaleY: 0.12, skewX: 0 }, { rotation: 38, scaleY: 1, skewX: -8, duration: 0.42, ease: "back.out(2.4)", transformOrigin: "100% 100%" }, 0.02);
    tl.fromTo("#ub-backflap", { scaleY: 0.1 }, { scaleY: 1, duration: 0.38, ease: "back.out(2)", transformOrigin: "50% 100%" }, 0.04);
    tl.fromTo("#ub-frontflap", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "bounce.out", transformOrigin: "50% 0%" }, 0.03);
    // the box kicks every time something comes out of it
    for (const k of [...RISE, ...FOUNT]) tl.fromTo("#ub-front", { scaleY: 0.95 }, { scaleY: 1, duration: 0.16, ease: "back.out(3)", transformOrigin: "50% 100%", immediateRender: false }, k);
    tl.to(["#ub-front", "#ub-frontflap", "#ub-flap-l", "#ub-flap-r", "#ub-back", "#ub-backflap", "#ub-shadow"], { y: 700, duration: 0.3, ease: "power3.in" }, COLLAPSE);
    // words and tags
    tl.fromTo("#ub-open-in", { scale: 1.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.12, ease: "back.out(2.2)" }, 0);
    for (let k = 0; k < HERO; k++) tl.fromTo("#ub-tag" + k + "-in", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.12, ease: "power3.out" }, RISE[k] + 0.12);
    tl.call(render, null, 0);
    render();
    window.__timelines["burst"] = tl;
  </script>
