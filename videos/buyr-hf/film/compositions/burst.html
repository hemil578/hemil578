      // the one landed item nearest the front carries the name + price chip

        const depth = (Math.sin(a) + 1) / 2;               // 0 back … 1 front
        const sx = CX + Math.cos(a) * RX, sy = CY + Math.sin(a) * RY * 0.62 + (depth - 0.5) * 140;
        const sc = 0.6 + 0.5 * depth;
        const f = Math.min(1, (t - t0) / FLY), e = ease(f);
        let x = MOUTH[0] + (sx - MOUTH[0]) * e, y = MOUTH[1] + (sy - MOUTH[1]) * e - Math.sin(Math.PI * f) * 260;

        const front = i === best ? 1 : 0;
        gsap.set(el.querySelector(".bu-chip"), { opacity: f < 1 || t > COLLAPSE ? 0 : front, scale: 1 / Math.max(0.3, s), transformOrigin: "50% 0%" });
