<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #00c9a7; font-family: "Poppins", sans-serif; }
    /* phone continues from the feed scene (same place, same 1.08 punch-in) */
    #pg-cam { position: absolute; inset: 0; }
    #pg-phone { position: absolute; left: 170px; top: 470px; width: 740px; height: 1316px; border-radius: 76px; background: #0b0b0d; padding: 18px; box-shadow: 0 46px 60px rgba(15,23,42,0.35); }
    #pg-screen { width: 704px; height: 1280px; border-radius: 60px; overflow: hidden; background: #000; }
    #pg-screen img { width: 704px; height: 1280px; object-fit: cover; }
    /* the real buyrshop.com product page (captured at 2.5x, 1080 px wide) */
    #pg-pagewrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #pg-zoom { position: absolute; left: 0; top: 0; width: 1080px; height: 5375px; }
    #pg-scroll { position: absolute; left: 0; top: 0; width: 1080px; height: 5375px; }
    #pg-page { position: absolute; left: 0; top: 0; width: 1080px; height: 5375px; }
    #pg-underline { position: absolute; left: 40px; top: 792px; width: 368px; height: 12px; border-radius: 6px; background: #00c9a7; }
    #pg-press { opacity: 0; position: absolute; left: 40px; top: 4089px; width: 1000px; height: 128px; border-radius: 26px; background: #0f172a; }
    #pg-ripple { opacity: 0; position: absolute; left: 480px; top: 4093px; width: 120px; height: 120px; border-radius: 60px; border: 8px solid #ffffff; }
    #pg-grow { opacity: 0; position: absolute; left: 40px; top: 1159px; width: 1000px; height: 128px; border-radius: 26px; background: #00c9a7; }
    #pg-peng { position: absolute; left: 0; top: 0; width: 441px; height: 644px; }
    #pg-cursor { position: absolute; left: 0; top: 0; width: 120px; height: 150px; }
    .pg-line { position: absolute; left: 0; right: 0; top: 190px; text-align: center; font-weight: 800; font-size: 150px; line-height: 1; letter-spacing: -0.02em; color: #ffffff; -webkit-text-stroke: 7px #0f172a; paint-order: stroke fill; }
    .pg-line span { display: inline-block; }
  </style>
  <div id="root" data-composition-id="page" data-width="1080" data-height="1920">
    <div id="pg-cam" data-layout-allow-overflow>
      <div id="pg-phone"><div id="pg-screen"><img src="assets/glow-still.jpg" alt="Glow penguin video frame" /></div></div>
    </div>
    <div id="pg-pagewrap" data-layout-allow-overflow>
      <div id="pg-zoom">
        <div id="pg-scroll">
          <img id="pg-page" src="assets/page.png" alt="buyrshop.com Glow Penguin Plush product page" />
          <div id="pg-underline"></div>
          <div id="pg-press"></div>
          <div id="pg-ripple"></div>
        </div>
      </div>
    </div>
    <div id="pg-grow"></div>
    <img id="pg-peng" src="assets/penguin-glow-cut.png" alt="Glow Penguin Plush" />
    <svg id="pg-cursor" data-layout-allow-overflow viewBox="0 0 24 30">
      <path d="M3 2 L3 24 L8.5 18.8 L12.3 27.5 L16 25.9 L12.3 17.4 L19.8 17.4 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" stroke-linejoin="round" />
    </svg>
    <div id="pg-want" class="pg-line clip" data-start="0.44" data-duration="0.7"><span id="pg-want-in">WANT IT?</span></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // split a headline into letters (bottom-up-letters pattern) so it can be staggered
    const letters = (sel) => { const el = document.querySelector(sel); const txt = el.innerHTML.split(/<br\s*\/?>/i);
      el.innerHTML = txt.map((line) => Array.from(line).map((c) => '<span class="kl" style="display:inline-block">' + (c === " " ? "&nbsp;" : c) + "</span>").join("")).join("<br />");
      return el.querySelectorAll(".kl"); };
    const slam = (sel, t0) => tl.fromTo(letters(sel), { y: 110, rotation: 12, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.32, ease: "back.out(2.4)", stagger: 0.022 }, t0);
    const PAGE_IN = 0.6, LAND = 1.3, PRICE = 1.95, SCROLL = 2.6, TAP = 4.35, GROW = 4.48, END = 4.95;
    const SCROLL_Y = -2930; // ADD TO CART lands at y 1159 on screen

    // initial states
    tl.set("#pg-cam", { scale: 1.08, transformOrigin: "540px 1100px" }, 0);
    tl.set("#pg-pagewrap", { y: 1920 }, 0);
    tl.set("#pg-peng", { x: 540 - 220, y: 1130 - 322, scale: 0.55, rotation: 0 }, 0);
    tl.set(["#pg-underline"], { scaleX: 0, transformOrigin: "0% 50%" }, 0);
    tl.set("#pg-cursor", { x: 1180, y: 2000, opacity: 1 }, 0);

    // 2.9 hit: the penguin bursts out of the screen toward camera; the phone falls away
    tl.to("#pg-peng", { x: 540 - 220, y: 900 - 322, scale: 1.35, rotation: -10, duration: 0.3, ease: "back.out(1.6)" }, 0);
    tl.to("#pg-cam", { y: 1800, rotation: 14, duration: 0.55, ease: "power3.in" }, 0.05);
    // 3.34 hit: WANT IT?
    slam("#pg-want-in", 0.44);
    // the real product page rises
    tl.to("#pg-pagewrap", { y: 0, duration: 0.45, ease: "power3.out" }, PAGE_IN);
    // the penguin flies into its own photo on the page and lands
    tl.to("#pg-peng", { x: 788 - 220, y: 1412 - 322, scale: 1.16, rotation: 0, duration: 0.42, ease: "power2.inOut" }, 0.86);
    tl.to("#pg-peng", { opacity: 0, duration: 0.14, ease: "power1.in" }, LAND);
    tl.fromTo("#pg-ripple", { x: 300, y: -2680, scale: 0.4, opacity: 0.9 }, { scale: 5, opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, LAND);

    // 4.85: punch in on the real price, underline it
    tl.to("#pg-zoom", { scale: 1.75, duration: 0.3, ease: "expo.out", transformOrigin: "40px 748px" }, PRICE);
    tl.to("#pg-underline", { scaleX: 1, duration: 0.2, ease: "power3.out" }, PRICE + 0.12);
    tl.to("#pg-zoom", { scale: 1, duration: 0.25, ease: "power3.inOut" }, SCROLL - 0.1);
    // 5.45: whip-scroll down to ADD TO CART
    tl.to("#pg-scroll", { y: SCROLL_Y, duration: 0.8, ease: "expo.inOut" }, SCROLL);
    tl.fromTo("#pg-page", { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.35, ease: "power2.in", yoyo: true, repeat: 1 }, SCROLL + 0.05);
    // cursor comes in and taps
    tl.to("#pg-cursor", { x: 590, y: 1205, duration: 0.6, ease: "power3.out" }, 3.5);
    tl.to("#pg-cursor", { scale: 0.82, duration: 0.07, ease: "power2.in", yoyo: true, repeat: 1, transformOrigin: "10% 5%" }, TAP - 0.04);
    tl.to("#pg-press", { opacity: 0.18, duration: 0.05, yoyo: true, repeat: 1 }, TAP);
    tl.fromTo("#pg-ripple", { x: 0, y: 0, scale: 0.3, opacity: 0.9 }, { scale: 2.6, opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, TAP);
    // the teal button grows into the next world
    tl.to("#pg-grow", { opacity: 1, duration: 0.04 }, GROW);
    tl.to("#pg-cursor", { opacity: 0, duration: 0.1 }, GROW);
    tl.to("#pg-grow", { scaleX: 1.12, scaleY: 16.5, y: -263, borderRadius: 0, duration: END - GROW - 0.02, ease: "expo.in", transformOrigin: "50% 50%" }, GROW + 0.02);

    window.__timelines["page"] = tl;
  </script>
</template>
