<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IB;src:url(/edit-v1/assets/fonts/Inter-Black.otf)}
*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:IB;position:relative;perspective:1600px}
.ly{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden}.ly img{width:100%;height:100%;object-fit:cover;display:block}
.bar{position:absolute;width:2600px;height:520px;left:-760px;background:#00c9a7;border-radius:260px}
#slices div{position:absolute;left:0;right:0;overflow:hidden}#slices img{position:absolute;left:0;width:1080px;height:1920px;object-fit:cover}
#ring{position:absolute;left:540px;top:960px;border:28px solid #00c9a7;border-radius:50%;transform:translate(-50%,-50%)}
#leak{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 30%,rgba(255,190,90,.95),rgba(255,90,60,.5) 35%,rgba(255,255,255,0) 70%);mix-blend-mode:screen}
#tag{position:absolute;left:0;right:0;bottom:300px;text-align:center}#tag span{background:rgba(15,23,42,.85);color:#00c9a7;font-size:44px;padding:12px 26px;border-radius:14px;border:3px solid #00c9a7}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="mbx"><feGaussianBlur id="mbxf" stdDeviation="0 0"/></filter></svg>
<div id="A" class="ly"><img id="Ai"></div><div id="B" class="ly"><img id="Bi"></div>
<div id="bars"></div><div id="slices"></div><div id="ring"></div><div id="leak"></div><div id="flash" class="ly" style="background:#fff"></div><div id="tag"><span id="tagt"></span></div>
<script>
const BT=[0.116,0.743,1.347,1.95,2.554,3.135,3.738,4.342,4.946,5.55,6.153];
const NF={c02:22,c03:22,c04:25,c05:23,c09:23,c09b:23,c06:23,c07:23,c08:23,c08b:23};
const CL=['c02','c03','c04','c05','c09','c09b','c06','c07','c08','c08b'];
const TR=['WHIP PAN','ZOOM-THROUGH','TEAL SHAPE WIPE','GLITCH SLICE','IRIS RING','3D CARD FLIP','LIGHT-LEAK SPIN','PUNCH + SHAKE'];
const D=.28, cl=(x)=>Math.min(1,Math.max(0,x)), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eo=x=>1-Math.pow(1-x,3);
const $=i=>document.getElementById(i);
const src=(c,lt)=>`/edit-v1/assets/frames/${c}/${String(Math.min(NF[c],Math.floor(Math.max(0,lt)*30)+1)).padStart(3,'0')}.jpg`;
function reset(){for(const id of['A','B']){const e=$(id);e.style.cssText='';}$('bars').innerHTML='';$('slices').innerHTML='';$('ring').style.cssText='width:0;height:0;opacity:0';$('leak').style.opacity=0;$('flash').style.opacity=0;$('Ai').style.filter='';$('Bi').style.filter='';$('A').style.filter='';$('B').style.filter='';}
async function setImg(el,s){if(el.dataset.s!==s){el.dataset.s=s;el.src=s;}await el.decode().catch(()=>{});}
window.ready=()=>document.fonts.ready.then(()=>true);
window.seek=async t=>{
 reset(); const ws=[];
 // clip i plays from BT[i+1] (clip 0 from 0); transition k centred on BT[k+2] (k=0..7)
 let i=0; for(let j=0;j<CL.length;j++) if(t>=(j?BT[j]:0)) i=j;
 let k=-1,p=0; for(let j=0;j<8;j++){const c=BT[j+2]; if(t>=c-D/2&&t<c+D/2){k=j;p=(t-(c-D/2))/D;}}
 const tagK = k>=0 ? k : Math.min(7, Math.max(0, i-2)); $('tagt').textContent = TR[tagK]; $('tag').style.opacity = (k>=0 || i>=2) ? 1 : 0;
 if(k<0){ ws.push(setImg($('Ai'),src(CL[i],t-(i?BT[i]:0)))); $('B').style.opacity=0;
   const lt=t-(i?BT[i]:0); $('A').style.transform=`scale(${1.04+.03*cl(lt/.6)})`; await Promise.all(ws); return; }
 const a=CL[k+1], b=CL[k+2], cut=BT[k+2];
 ws.push(setImg($('Ai'),src(a,t-BT[k+1])), setImg($('Bi'),src(b,t-cut)));
 const A=$('A'),B=$('B'),e=eio(p);
 if(k===0){ // whip pan
   A.style.transform=`translateX(${-1100*e}px)`; B.style.transform=`translateX(${1100*(1-e)}px)`;
   const bl=Math.sin(p*Math.PI)*60; $('mbxf').setAttribute('stdDeviation',`${bl} 0`); A.style.filter=B.style.filter='url(#mbx)'; }
 if(k===1){ // zoom-through
   if(p<.5){B.style.opacity=0;A.style.transform=`scale(${1+3*eio(p*2)})`;A.style.filter=`blur(${p*40}px)`;}
   else{A.style.opacity=0;B.style.transform=`scale(${.4+.6*eo((p-.5)*2)})`;B.style.filter=`blur(${(1-p)*30}px)`;}
   $('flash').style.opacity=Math.sin(p*Math.PI)*.5; }
 if(k===2){ // teal shape wipe: 3 rounded bars sweep diagonally
   const h=[];for(let n=0;n<3;n++){const q=cl(p*1.6-n*.15);const y=-700+2800*eio(q);h.push(`<div class="bar" style="top:${y-n*560}px;transform:rotate(-24deg);background:${n===1?'#0f172a':'#00c9a7'}"></div>`);}
   $('bars').innerHTML=h.join(''); B.style.opacity=p>.5?1:0; A.style.opacity=p>.5?0:1; }
 if(k===3){ // glitch slice
   B.style.opacity=p>.45?1:0; A.style.opacity=p>.45?0:1; const s=p>.45?b:a, lt=p>.45?t-cut:t-BT[k+1]; const h=[];
   for(let n=0;n<14;n++){const y=n*137, off=Math.sin(n*12.9+p*40)*180*Math.sin(p*Math.PI);
     h.push(`<div style="top:${y}px;height:137px"><img src="${src(s,lt)}" style="top:${-y}px;transform:translateX(${off}px);filter:${n%4===0?'hue-rotate(150deg) saturate(1.6)':'none'}"></div>`);}
   $('slices').innerHTML=h.join(''); }
 if(k===4){ // iris ring
   const r=2400*eio(p); B.style.clipPath=`circle(${r/2}px at 540px 960px)`; const rg=$('ring'); rg.style.width=rg.style.height=(r+40)+'px'; rg.style.opacity=1-p*.3; A.style.transform=`scale(${1+.15*p})`; }
 if(k===5){ // 3D card flip
   document.body.style.background='#00c9a7';
   if(p<.5){B.style.opacity=0;A.style.transform=`scale(${1-.25*Math.sin(p*Math.PI)}) rotateY(${180*e}deg)`;}
   else{A.style.opacity=0;B.style.transform=`scale(${1-.25*Math.sin(p*Math.PI)}) rotateY(${180*e-180}deg)`;} } else document.body.style.background='#000';
 if(k===6){ // light-leak spin
   B.style.opacity=p>.4?1:0;A.style.opacity=p>.4?0:1; const sp=(p-.5); A.style.transform=`rotate(${sp*30}deg) scale(${1.2+Math.abs(sp)})`; B.style.transform=`rotate(${sp*30}deg) scale(${1.2+Math.abs(sp)})`;
   $('leak').style.opacity=Math.sin(p*Math.PI); $('flash').style.opacity=Math.max(0,1-Math.abs(p-.45)*6)*.8; }
 if(k===7){ // punch + shake
   B.style.opacity=p>.5?1:0;A.style.opacity=p>.5?0:1; const q=p>.5?(p-.5)*2:0; const sx=Math.sin(t*93)*30*(1-q), sy=Math.cos(t*71)*30*(1-q);
   B.style.transform=`translate(${sx}px,${sy}px) scale(${1.35-.3*eo(q)})`; A.style.transform=`scale(${1+.3*eio(p*2)})`; $('flash').style.opacity=p>.5?.6*(1-q):0; }
 await Promise.all(ws);
};
</script></body></html>
