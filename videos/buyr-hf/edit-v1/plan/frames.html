<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IB;src:url(/mvd/assets/fonts/Inter-Black.otf)}
@font-face{font-family:IT;src:url(/mvd/assets/fonts/Inter-Thin.otf)}
*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:#000;position:relative;font-family:IB}
.l{position:absolute;inset:0}.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#gl{position:absolute;inset:0;width:1080px;height:1920px}
.thin{position:absolute;left:0;right:0;text-align:center;font-family:IT;color:#fff;letter-spacing:.02em;text-shadow:0 4px 18px rgba(0,0,0,.55)}
.vig{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 40%,rgba(0,0,0,.7) 100%)}
.grain{opacity:.12;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
.big{position:absolute;left:0;right:0;text-align:center;color:#00c9a7;letter-spacing:-.05em;line-height:.82}
.sel{position:absolute;border:4px dashed #00c9a7}.sel i{position:absolute;width:30px;height:30px;background:#fff;border:4px solid #00c9a7}
.chip{position:absolute;background:#00c9a7;color:#0f172a;font:800 34px IB;padding:8px 16px;border-radius:8px}
.echo{position:absolute;left:0;right:0;text-align:center;font-size:250px;letter-spacing:-.04em;line-height:1}
.bars{position:absolute;left:0;right:0;height:150px;background:#000}
.speed{background:repeating-conic-gradient(from 0deg at 50% 40%,rgba(255,255,255,0) 0 3deg,rgba(255,255,255,.13) 3deg 3.6deg);mix-blend-mode:screen}
.card{position:absolute;left:110px;right:110px;top:470px;height:980px;border-radius:56px;background:linear-gradient(160deg,rgba(23,37,64,.92),rgba(8,14,28,.95));border:3px solid rgba(0,201,167,.6);box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 60px rgba(0,201,167,.25)}
.card .logo{position:absolute;left:110px;right:110px;top:70px;background:#fff;border-radius:30px;padding:26px 50px}.card .logo img{width:100%;display:block}
.pill{position:absolute;left:140px;right:140px;top:760px;height:120px;border-radius:60px;background:#00c9a7;color:#0f172a;font-size:64px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 0 #007a66}
.url{position:absolute;left:0;right:0;top:905px;text-align:center;color:#fff;font:400 46px IT;letter-spacing:.06em}
.lbl{position:absolute;left:26px;top:26px;z-index:50;background:rgba(0,0,0,.6);color:#fff;font:700 30px sans-serif;padding:8px 16px;border-radius:10px}
</style></head><body><div id="root"></div><canvas id="gl" width="1080" height="1920"></canvas>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {FontLoader} from 'three/addons/loaders/FontLoader.js';
import {TextGeometry} from 'three/addons/geometries/TextGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const k = location.hash.slice(1);
const fr = (c, f) => `/edit-v1/assets/frames/${c}/${String(f).padStart(3, '0')}.jpg`;
const R = document.getElementById('root');
const H = {
 hook: `<img class="full" src="${fr('c01', 8)}" style="transform:scale(1.14);filter:contrast(1.15) saturate(1.2) brightness(.9)"><div class="l vig"></div>
   <div class="thin" style="top:250px;font-size:96px">you don't</div><div class="l grain"></div>`,
 product: `<img class="full" src="${fr('c06', 12)}" style="filter:brightness(.5) saturate(.85) blur(3px);transform:scale(1.04)">
   <div class="big" style="top:330px;font-size:330px">$19.99</div><img class="full" src="/edit-v1/plan/cut/c06_hq.png" style="filter:drop-shadow(0 30px 40px rgba(0,0,0,.65))">
   <div class="sel" style="left:200px;top:590px;width:780px;height:800px"><i style="left:-17px;top:-17px"></i><i style="right:-17px;top:-17px"></i><i style="left:-17px;bottom:-17px"></i><i style="right:-17px;bottom:-17px"></i></div>
   <div class="chip" style="left:200px;top:530px">Butter Squishy</div><div class="thin" style="top:1420px;font-size:84px">the butter squishy</div><div class="l grain"></div>`,
 break: `<img class="full" src="${fr('c13', 10)}" style="filter:grayscale(1) contrast(1.35) brightness(.75);transform:scale(1.18)">
   <div class="echo" style="top:840px;color:rgba(0,201,167,.18);transform:translate(48px,48px)">WAIT.</div><div class="echo" style="top:840px;color:rgba(0,201,167,.32);transform:translate(32px,32px)">WAIT.</div>
   <div class="echo" style="top:840px;color:rgba(0,201,167,.55);transform:translate(16px,16px)">WAIT.</div><div class="echo" style="top:840px;color:#fff">WAIT.</div>
   <div class="thin" style="top:1120px;font-size:70px">what is that?</div><div class="bars" style="top:0"></div><div class="bars" style="bottom:0"></div><div class="l grain"></div>`,
 drop: `<img class="full" src="${fr('c21', 6)}" style="transform:scale(1.2) rotate(-2deg);filter:contrast(1.2) saturate(1.45) brightness(1.05)"><div class="l speed"></div>
   <div class="l" style="background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%)"></div><div class="l vig"></div><div class="l grain"></div>`,
 end: `<img class="full" src="${fr('c30', 16)}" style="filter:blur(18px) brightness(.55) saturate(1.2);transform:scale(1.1)"><div class="card"><div class="logo"><img src="/edit-v1/assets/logo.png"></div>
   <div class="pill">SHOP NOW</div><div class="url">buyrshop.com</div></div>`,
};
const L = {hook: '0.4 s · HOOK · punch-in + 3D keyword', product: '4.6 s · PRODUCT · text behind product + selection box', break: '10.2 s · BREAKDOWN · B&W freeze + echo trail', drop: '14.3 s · DROP · colour pop + 3D chrome', end: '22 s · END · 3D type on glass card'};
R.innerHTML = H[k] + `<div class="lbl">${L[k]}</div>`;

// 3D keywords (motion-video-director §11: 3D only at the peaks)
const r = new THREE.WebGLRenderer({canvas: document.getElementById('gl'), alpha: true, antialias: true, preserveDrawingBuffer: true});
r.setSize(1080, 1920, false); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const env = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), .04).texture;
const s = new THREE.Scene(); s.environment = env;
s.add(new THREE.HemisphereLight(0xffffff, 0x223344, .9)); const kl = new THREE.DirectionalLight(0xffffff, 2.2); kl.position.set(3, 6, 8); s.add(kl);
const rim = new THREE.PointLight(0x00f5cc, 60, 30); rim.position.set(-4, 2, -2); s.add(rim);
const cam = new THREE.PerspectiveCamera(34, 1080 / 1920, .1, 100); cam.position.set(0, 0, 18); cam.lookAt(0, 0, 0);
const chrome = new THREE.MeshStandardMaterial({color: 0xf4f7fa, metalness: 1, roughness: .14});
const teal = new THREE.MeshPhysicalMaterial({color: 0x00c9a7, metalness: .3, roughness: .2, clearcoat: 1, emissive: 0x00c9a7, emissiveIntensity: .15});
const white = new THREE.MeshPhysicalMaterial({color: 0xffffff, roughness: .25, clearcoat: 1});
const T = {
 hook: [["NEED THIS.", chrome, .95, 2.2, 0, -.12]],
 drop: [["HAS THEM", chrome, 1.05, 3.4, .1, -.18], ["ALL", teal, 1.9, 1.75, -.05, -.18]],
 end: [["YOU", white, .58, .05, 0, 0], ["WANT IT.", teal, .58, -.75, 0, 0]],
};
window.done = false;
new FontLoader().load('/mvd/assets/fonts/inter-black.typeface.json', font => {
  for (const [str, m, size, y, rz, rx] of (T[k] || [])) {
    const g = new TextGeometry(str, {font, size, height: size * .42, curveSegments: 8, bevelEnabled: true, bevelThickness: size * .05, bevelSize: size * .03, bevelSegments: 4});
    g.computeBoundingBox(); const b = g.boundingBox; g.translate(-(b.min.x + b.max.x) / 2, -(b.min.y + b.max.y) / 2, -b.max.z / 2);
    const me = new THREE.Mesh(g, m); me.position.y = y; me.rotation.set(rx, -.12, rz); s.add(me);
  }
  r.render(s, cam); window.done = true;
});
</script></body></html>
