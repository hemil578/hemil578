<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IB;src:url(../../mvd/assets/fonts/Inter-Black.otf)}
@font-face{font-family:IX;src:url(../../mvd/assets/fonts/Inter-ExtraBold.otf)}
*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:IB;position:relative}
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lbl{position:absolute;left:30px;top:30px;background:#fff;color:#000;font:800 34px sans-serif;padding:8px 18px;border-radius:10px;z-index:99}
/* A chrome */
.chrome{position:absolute;left:0;right:0;text-align:center;line-height:.95;letter-spacing:-.03em;
 background:linear-gradient(180deg,#fff 0%,#dfe7ee 38%,#7d8b99 52%,#f4f8fb 64%,#b9c6d2 100%);-webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 3px 0 #5b6b7a) drop-shadow(0 6px 0 #3d4b58) drop-shadow(0 10px 0 #24303b) drop-shadow(0 0 40px rgba(0,201,167,.55))}
.chrome em{font-style:normal;background:linear-gradient(180deg,#bfffee 0%,#00e0b9 45%,#00806b 55%,#3dffd6 100%);-webkit-background-clip:text}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.75) 100%)}
.grain{position:absolute;inset:0;opacity:.13;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.speed{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,255,255,.0) 0deg 4deg,rgba(255,255,255,.10) 4deg 5deg);mix-blend-mode:screen}
/* B text behind */
.big{position:absolute;left:-20px;right:-20px;text-align:center;font-size:330px;line-height:.85;letter-spacing:-.05em;color:#00c9a7}
.cut{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.small{position:absolute;left:0;right:0;text-align:center;color:#fff;font-size:70px;letter-spacing:-.01em}
/* C neon glitch */
.gl{position:absolute;left:0;right:0;text-align:center;color:#fff;line-height:.95;letter-spacing:-.02em;text-shadow:-8px 0 0 #ff2d6f,8px 0 0 #00f0ff,0 0 40px rgba(0,240,255,.8)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 3px,transparent 3px 7px)}
.rgb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:screen;opacity:.55}
.bar{position:absolute;left:0;right:0;height:46px;background:rgba(0,240,255,.25);mix-blend-mode:screen}
/* D collage */
.half{position:absolute;inset:0;background:#00c9a7;background-image:radial-gradient(#0a8f79 22%,transparent 23%);background-size:26px 26px}
.pola{position:absolute;background:#fff;padding:26px 26px 110px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.pola img{display:block;width:100%;height:100%;object-fit:cover}
.tape{position:absolute;background:#fff;color:#0f172a;padding:14px 30px;font-size:96px;letter-spacing:-.02em;box-shadow:0 8px 0 #0f172a}
.badge{position:absolute;width:300px;height:300px;border-radius:50%;background:#ffd23f;color:#0f172a;display:flex;align-items:center;justify-content:center;font-size:86px;border:8px solid #0f172a;transform:rotate(-12deg)}
.marker{position:absolute;font-family:'Comic Sans MS',cursive;color:#0f172a;font-size:80px;transform:rotate(-6deg)}
</style></head><body><div id="r"></div>
<script>
const F={hook:['c01',8,"YOU DON'T","NEED THIS."],prod:['c06',12,'Butter Squishy','$19.99'],drop:['c21',6,'HAS THEM','ALL']};
const [st,fr]=location.hash.slice(1).split('-'); const [c,f,l1,l2]=F[fr]; const src=`../assets/frames/${c}/${String(f).padStart(3,'0')}.jpg`, cut=`cut/${c}.png`;
let h='';
if(st==='A'){h=`<img class="full" src="${src}" style="filter:contrast(1.18) saturate(1.25) brightness(.85);transform:scale(1.08)">${fr==='drop'?'<div class="speed"></div>':''}<div class="vig"></div>
 <div class="chrome" style="top:${fr==='prod'?1180:260}px;font-size:${fr==='prod'?120:150}px">${fr==='prod'?l1+'<br><em>'+l2+'</em>':fr==='drop'?l1+'<br><em>'+l2+'</em>':l1+'<br>'+l2}</div><div class="grain"></div>`;}
if(st==='B'){h=`<img class="full" src="${src}" style="filter:brightness(.55) saturate(.9) blur(2px)">
 <div class="big" style="top:${fr==='prod'?620:520}px">${fr==='prod'?'$19<br>.99':fr==='drop'?'HAS<br>THEM<br>ALL':'DON\'T<br>NEED'}</div><img class="cut" src="${cut}">
 <div class="small" style="top:${fr==='hook'?270:fr==='prod'?300:270}px">${fr==='hook'?'YOU':'' }${fr==='prod'?'Butter Squishy':''}${fr==='drop'?'buyr':''}</div>${fr==='hook'?'<div class="small" style="top:1480px">THIS.</div>':''}<div class="grain"></div>`;}
if(st==='C'){h=`<img class="full" src="${src}" style="filter:contrast(1.25) saturate(1.3) hue-rotate(-8deg)"><img class="rgb" src="${src}" style="transform:translateX(14px);filter:sepia(1) saturate(8) hue-rotate(-50deg)"><img class="rgb" src="${src}" style="transform:translateX(-14px);filter:sepia(1) saturate(8) hue-rotate(140deg)">
 <div class="bar" style="top:720px"></div><div class="bar" style="top:1310px;height:20px"></div><div class="scan"></div>
 <div class="gl" style="top:${fr==='prod'?1200:300}px;font-size:${fr==='prod'?110:150}px">${l1}<br><span style="color:#00f0ff">${l2}</span></div>`;}
if(st==='D'){h=`<div class="half"></div><div class="pola" style="left:150px;top:${fr==='prod'?380:470}px;width:780px;height:1100px;transform:rotate(${fr==='drop'?4:-4}deg)"><img src="${src}"></div>
 <div class="tape" style="left:70px;top:${fr==='prod'?160:190}px;transform:rotate(-4deg)">${l1}</div><div class="tape" style="left:${fr==='prod'?500:300}px;top:${fr==='prod'?1560:310}px;transform:rotate(3deg);background:#0f172a;color:#fff;box-shadow:0 8px 0 #00c9a7">${fr==='prod'?'TAP TO SHOP':l2}</div>
 ${fr==='prod'?'<div class="badge" style="left:700px;top:230px">$19.99</div>':''}${fr==='drop'?'<div class="badge" style="left:690px;top:1450px;font-size:58px;text-align:center">FROM<br>$9.99</div>':''}
 ${fr==='hook'?'<div class="marker" style="left:560px;top:1630px">...or do you? 👀</div>':''}`;}
const names={A:'A · CHROME 3D + GRADE',B:'B · TEXT BEHIND PRODUCT',C:'C · NEON GLITCH',D:'D · MAGAZINE COLLAGE'};
document.getElementById('r').innerHTML=h+`<div class="lbl">${names[st]}</div>`;
</script></body></html>
