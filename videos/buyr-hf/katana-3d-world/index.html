const eob=(x,s=1.9)=>{x=Math.min(1,Math.max(0,x));const c=s+1;return 1+c*Math.pow(x-1,3)+s*Math.pow(x-1,2);};
const eio=x=>{x=Math.min(1,Math.max(0,x));return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};

const frameFor=(o,t)=>{const p=o.p;let cur=p.c[0];for(const c of p.c) if(t>=S(c[1])-1e-6) cur=c;const n=N[cur[0]];let k=Math.floor((t-S(cur[1]))*30+1e-6);

const pose=(i,t)=>{const o=panels[i],p=o.p,t0=S(p.b[0])+FL,t1=S(p.b[1]);const u=Math.max(0,t-t0),H=Math.max(.3,t1-t0);

const shakeAt=t=>{let s=0;for(const j of [13,14,15,21,22,23,24,35]){const d=t-S(j)-0.05;if(d>0&&d<.35)s=Math.max(s,(j>=21&&j<=24?(j-19)*5:14)*(1-d/.35));}return s;};
const flashAt=t=>{for(const j of [4,13,24,35]){const d=t-S(j);if(d>=0&&d<.067)return 1;}for(const j of [21,22,23]){const d=t-S(j);if(d>=0&&d<.067)return .4;}return 0;};

 const ci=curIdx(t);const fin=t>=S(35);

  if(fk>0){const dk=eio(Math.min(1,Math.max(0,(t-S(35)-.25-((i*7)%24)*.018)/1.0)));const col=i%5,row=Math.floor(i/5);const gx=(col-2)*760,gy=yMid+(2-row)*1230+18*Math.sin(t*2+i),gz=-200+((i*13)%5)*60;o.g.position.lerp(new THREE.Vector3(gx,gy,gz),dk);
   const qa=new THREE.Quaternion().setFromEuler(o.g.rotation),qb=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,.04*Math.sin(t+i),.02*Math.sin(t*1.3+i)));qa.slerp(qb,dk);o.g.quaternion.copy(qa);}

 const sh=shakeAt(t);cam.position.copy(pos).add(new THREE.Vector3(Math.sin(t*91)*sh,Math.cos(t*77)*sh,0));cam.up.set(0,1,0);cam.lookAt(tg);cam.rotateZ(roll);

  it.g.rotation.y=(it.spin?.25:.4)*Math.sin(1.7*lt+it.t0)*(it.fin?.5:1);it.g.rotation.x=.12+.07*Math.sin(1.3*lt+1);
